<template>
    <lightning-card title="Create Service Request" icon-name="standard:case">
        <div class="slds-p-around_medium request-form">

            <div class="slds-p-bottom_small form-section">
                <lightning-textarea
                    label="Issue Description"
                    placeholder="Describe the issue in detail..."
                    value={description}
                    onchange={handleDescription}>
                </lightning-textarea>
            </div>

            <div class="slds-grid slds-gutters slds-wrap form-section">
                <div class="slds-col slds-size_1-of-2 slds-small-size_1-of-1">
                    <lightning-combobox
                        label="Priority"
                        value={priority}
                        options={priorityOptions}
                        onchange={handlePriority}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-small-size_1-of-1">
                    <lightning-combobox
                        label="Status"
                        value={status}
                        options={statusOptions}
                        onchange={handleStatus}>
                    </lightning-combobox>
                </div>
            </div>

            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                    label="Create Service Request"
                    icon-name="utility:add"
                    variant="brand"
                    onclick={createRequest}
                    class="submit-btn">
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
